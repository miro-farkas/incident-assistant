quarkus.application.name=ops-tools-mcp

# --- MCP endpoints (A-0005, P-0006) ------------------------------------------
# Read and action tools are served by two MCP servers on separate paths; the default server is
# not exposed. Streamable HTTP at the root path, legacy SSE below it at /sse.
quarkus.mcp.server.http.enabled=false
quarkus.mcp.server.read.http.root-path=/mcp/read
quarkus.mcp.server.read.server-info.name=ops-tools-read
quarkus.mcp.server.actions.http.root-path=/mcp/actions
quarkus.mcp.server.actions.server-info.name=ops-tools-actions
# Results are structured content; the same JSON is also sent as text for clients that read only
# text content.
quarkus.mcp.server.read.tools.structured-content.compatibility-mode=true
quarkus.mcp.server.actions.tools.structured-content.compatibility-mode=true

# --- access to action tools (A-0005) -----------------------------------------
# The action paths require role ops-actions, which only a request with the API key in header
# X-Api-Key gets. ActionTools checks the role again on every call. The read paths are open.
quarkus.http.auth.permission.ops-actions.paths=/mcp/actions,/mcp/actions/*
quarkus.http.auth.permission.ops-actions.policy=ops-actions
quarkus.http.auth.policy.ops-actions.roles-allowed=ops-actions
# Comes from OPS_ACTIONS_API_KEY in prod; at least 32 characters.
%dev.ops.actions.api-key=dev-only-actions-key-not-a-secret-0001
%test.ops.actions.api-key=test-only-actions-key-not-a-secret-01

# --- simulated services (A-0005) ---------------------------------------------
# Scenario per service: healthy, bad-deployment, memory-leak or downstream-timeout.
# Fault per service: none, unavailable or slow (delayed by ops.faults.slow-delay).
ops.services.checkout.scenario=bad-deployment
ops.services.payments.scenario=downstream-timeout
ops.services.inventory.scenario=memory-leak
ops.faults.slow-delay=5s
ops.actions.idempotency-retention=24h
ops.actions.max-idempotency-records=10000

# --- dev ---------------------------------------------------------------------
# Runs next to incident-assistant-app (port 8080) in dev mode.
%dev.quarkus.http.port=8081
%dev.quarkus.log.category."dev.mfa.incident".level=DEBUG

# --- test --------------------------------------------------------------------
%test.quarkus.http.test-port=0
# A fixed "now" makes every timestamp of the simulated data reproducible.
%test.ops.fake-data.anchor=2026-10-18T10:00:00Z

# --- prod --------------------------------------------------------------------
# Quarkus defaults; override with environment variables such as QUARKUS_HTTP_PORT.
