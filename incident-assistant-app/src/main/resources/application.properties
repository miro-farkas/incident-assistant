quarkus.application.name=incident-assistant-app

# Unique id of this instance (P-0003 lease owner). Defaults to the host name.
incident.instance.id=${HOSTNAME:${COMPUTERNAME:local}}

# --- database (A-0002) --------------------------------------------------------
# Connection settings come from QUARKUS_DATASOURCE_JDBC_URL, QUARKUS_DATASOURCE_USERNAME and
# QUARKUS_DATASOURCE_PASSWORD in prod; dev and test use Dev Services.
quarkus.datasource.db-kind=postgresql
# Same image family as INC-005 needs (pgvector); keeps dev and test on one PostgreSQL major.
quarkus.datasource.devservices.image-name=pgvector/pgvector:pg17
# Timeouts: waiting for a pooled connection, opening one, a single statement, a blocked socket
# read, and a whole transaction. statement_timeout < socketTimeout so the server cancels first.
quarkus.datasource.jdbc.acquisition-timeout=5S
quarkus.datasource.jdbc.additional-jdbc-properties.connectTimeout=5
quarkus.datasource.jdbc.additional-jdbc-properties.options=-c statement_timeout=10s
quarkus.datasource.jdbc.additional-jdbc-properties.socketTimeout=30
quarkus.transaction-manager.default-transaction-timeout=30S
# Flyway owns the schema; Hibernate only checks that entities match it.
quarkus.flyway.migrate-at-start=true
quarkus.hibernate-orm.schema-management.strategy=validate

# --- Kafka (A-0003, A-0007) --------------------------------------------------
# Brokers come from KAFKA_BOOTSTRAP_SERVERS in prod; dev and test use Dev Services.
# Alerts in: values and keys stay bytes, so the reader sees the raw size and the DLQ gets an
# exact copy. A failed record goes to the DLQ with the exception message in header
# dead-letter-reason.
mp.messaging.incoming.alerts.topic=ops.alerts.v1
mp.messaging.incoming.alerts.group.id=incident-assistant
mp.messaging.incoming.alerts.auto.offset.reset=earliest
mp.messaging.incoming.alerts.key.deserializer=org.apache.kafka.common.serialization.ByteArrayDeserializer
mp.messaging.incoming.alerts.value.deserializer=org.apache.kafka.common.serialization.ByteArrayDeserializer
mp.messaging.incoming.alerts.failure-strategy=dead-letter-queue
mp.messaging.incoming.alerts.dead-letter-queue.topic=ops.alerts.v1.dlq
# Alerts processed at the same time on virtual threads; each holds a database connection, so
# this stays below the connection pool size (default 20).
smallrye.messaging.worker.<virtual-thread>.max-concurrency=8
# Incident state events out, keyed by incident id. The relay waits for each acknowledgement
# (incident.outbox.relay.send-timeout), so the producer gives up before the relay does.
mp.messaging.outgoing.incident-events.topic=ops.incidents.events.v1
mp.messaging.outgoing.incident-events.key.serializer=org.apache.kafka.common.serialization.StringSerializer
mp.messaging.outgoing.incident-events.value.serializer=org.apache.kafka.common.serialization.StringSerializer
mp.messaging.outgoing.incident-events.acks=all
mp.messaging.outgoing.incident-events.max.block.ms=5000
mp.messaging.outgoing.incident-events.request.timeout.ms=4000
mp.messaging.outgoing.incident-events.delivery.timeout.ms=5000
# Dev and test brokers get the topics up front; several event partitions exercise keying.
quarkus.kafka.devservices.topic-partitions."ops.alerts.v1"=1
quarkus.kafka.devservices.topic-partitions."ops.alerts.v1.dlq"=1
quarkus.kafka.devservices.topic-partitions."ops.incidents.events.v1"=3

# --- alert ingestion (A-0003) -------------------------------------------------
incident.alerts.max-payload-bytes=65536
# Retries of one alert after a processing failure (for example a lost database connection),
# each in a new transaction; after the last one the record goes to the DLQ.
quarkus.fault-tolerance."dev.mfa.incident.service.AlertIngestionService/ingest".retry.max-retries=3
quarkus.fault-tolerance."dev.mfa.incident.service.AlertIngestionService/ingest".retry.delay=500
quarkus.fault-tolerance."dev.mfa.incident.service.AlertIngestionService/ingest".retry.delay-unit=millis
quarkus.fault-tolerance."dev.mfa.incident.service.AlertIngestionService/ingest".retry.jitter=200
quarkus.fault-tolerance."dev.mfa.incident.service.AlertIngestionService/ingest".retry.jitter-unit=millis
quarkus.fault-tolerance."dev.mfa.incident.service.AlertIngestionService/ingest".retry.max-duration=30
quarkus.fault-tolerance."dev.mfa.incident.service.AlertIngestionService/ingest".retry.max-duration-unit=seconds

# --- outbox relay (P-0003) ----------------------------------------------------
incident.outbox.relay.interval=1s
incident.outbox.relay.batch-size=100
incident.outbox.relay.send-timeout=10s
incident.outbox.relay.max-batch-duration=10s

# --- dev ---------------------------------------------------------------------
%dev.quarkus.http.port=8080
%dev.quarkus.log.category."dev.mfa.incident".level=DEBUG

# --- test --------------------------------------------------------------------
%test.quarkus.http.test-port=0
%test.incident.instance.id=test-instance

# --- prod --------------------------------------------------------------------
# No local fallback: every production instance must have an explicit, unique id.
%prod.incident.instance.id=${INCIDENT_INSTANCE_ID:${HOSTNAME}}
