quarkus.application.name=incident-assistant-app

# Unique id of this instance (P-0003 lease owner). Defaults to the host name.
incident.instance.id=${HOSTNAME:${COMPUTERNAME:local}}

# --- database (A-0002) --------------------------------------------------------
# Connection settings come from QUARKUS_DATASOURCE_JDBC_URL, QUARKUS_DATASOURCE_USERNAME and
# QUARKUS_DATASOURCE_PASSWORD in prod; dev and test use Dev Services.
quarkus.datasource.db-kind=postgresql
# Same image family as INC-005 needs (pgvector); keeps dev and test on one PostgreSQL major.
quarkus.datasource.devservices.image-name=pgvector/pgvector:pg17
# Timeouts: waiting for a pooled connection, opening one, a single statement, a blocked socket
# read, and a whole transaction. statement_timeout < socketTimeout so the server cancels first.
quarkus.datasource.jdbc.acquisition-timeout=5S
quarkus.datasource.jdbc.additional-jdbc-properties.connectTimeout=5
quarkus.datasource.jdbc.additional-jdbc-properties.options=-c statement_timeout=10s
quarkus.datasource.jdbc.additional-jdbc-properties.socketTimeout=30
quarkus.transaction-manager.default-transaction-timeout=30S
# Flyway owns the schema; Hibernate only checks that entities match it.
quarkus.flyway.migrate-at-start=true
quarkus.hibernate-orm.schema-management.strategy=validate

# --- dev ---------------------------------------------------------------------
%dev.quarkus.http.port=8080
%dev.quarkus.log.category."dev.mfa.incident".level=DEBUG

# --- test --------------------------------------------------------------------
%test.quarkus.http.test-port=0
%test.incident.instance.id=test-instance

# --- prod --------------------------------------------------------------------
# No local fallback: every production instance must have an explicit, unique id.
%prod.incident.instance.id=${INCIDENT_INSTANCE_ID:${HOSTNAME}}
