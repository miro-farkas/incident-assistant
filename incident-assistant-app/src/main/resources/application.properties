quarkus.application.name=incident-assistant-app

# Unique id of this instance (P-0003 lease owner). Defaults to the host name.
incident.instance.id=${HOSTNAME:${COMPUTERNAME:local}}

# --- database (A-0002) --------------------------------------------------------
# Connection settings come from QUARKUS_DATASOURCE_JDBC_URL, QUARKUS_DATASOURCE_USERNAME and
# QUARKUS_DATASOURCE_PASSWORD in prod; dev uses compose-devservices.yml, test uses Dev Services.
quarkus.datasource.db-kind=postgresql
# Same image family as INC-005 needs (pgvector) and the same image as compose-devservices.yml;
# keeps dev and test on one PostgreSQL major.
quarkus.datasource.devservices.image-name=pgvector/pgvector:pg17
# Timeouts: waiting for a pooled connection, opening one, a single statement, a blocked socket
# read, and a whole transaction. statement_timeout < socketTimeout so the server cancels first.
quarkus.datasource.jdbc.acquisition-timeout=5S
quarkus.datasource.jdbc.additional-jdbc-properties.connectTimeout=5
quarkus.datasource.jdbc.additional-jdbc-properties.options=-c statement_timeout=10s
quarkus.datasource.jdbc.additional-jdbc-properties.socketTimeout=30
quarkus.transaction-manager.default-transaction-timeout=30S
# Flyway owns the schema; Hibernate only checks that entities match it.
quarkus.flyway.migrate-at-start=true
quarkus.hibernate-orm.schema-management.strategy=validate

# --- Kafka (A-0003, A-0007) --------------------------------------------------
# Brokers come from KAFKA_BOOTSTRAP_SERVERS in prod; dev uses compose-devservices.yml, test uses
# Dev Services.
# Alerts in: values and keys stay bytes, so the reader sees the raw size and the DLQ gets an
# exact copy. A failed record goes to the DLQ with the exception message in header
# dead-letter-reason.
mp.messaging.incoming.alerts.topic=ops.alerts.v1
mp.messaging.incoming.alerts.group.id=incident-assistant
mp.messaging.incoming.alerts.auto.offset.reset=earliest
mp.messaging.incoming.alerts.key.deserializer=org.apache.kafka.common.serialization.ByteArrayDeserializer
mp.messaging.incoming.alerts.value.deserializer=org.apache.kafka.common.serialization.ByteArrayDeserializer
mp.messaging.incoming.alerts.failure-strategy=dead-letter-queue
mp.messaging.incoming.alerts.dead-letter-queue.topic=ops.alerts.v1.dlq
# Alerts processed at the same time on virtual threads; each holds a database connection, so
# this stays below the connection pool size (default 20).
smallrye.messaging.worker.<virtual-thread>.max-concurrency=8
# Incident state events out, keyed by incident id. The relay waits for each acknowledgement
# (incident.outbox.relay.send-timeout), so the producer gives up before the relay does.
mp.messaging.outgoing.incident-events.topic=ops.incidents.events.v1
mp.messaging.outgoing.incident-events.key.serializer=org.apache.kafka.common.serialization.StringSerializer
mp.messaging.outgoing.incident-events.value.serializer=org.apache.kafka.common.serialization.StringSerializer
mp.messaging.outgoing.incident-events.acks=all
mp.messaging.outgoing.incident-events.max.block.ms=5000
mp.messaging.outgoing.incident-events.request.timeout.ms=4000
mp.messaging.outgoing.incident-events.delivery.timeout.ms=5000
# Incident state events in again, for the event stream of this instance (A-0009): a consumer
# group per instance, from the latest offset, no offset commits, so every instance sees every
# event and a restart does not replay old ones.
mp.messaging.incoming.incident-events-stream.topic=ops.incidents.events.v1
mp.messaging.incoming.incident-events-stream.group.id=incident-assistant-stream-${incident.instance.id}
mp.messaging.incoming.incident-events-stream.auto.offset.reset=latest
mp.messaging.incoming.incident-events-stream.enable.auto.commit=false
mp.messaging.incoming.incident-events-stream.commit-strategy=ignore
mp.messaging.incoming.incident-events-stream.failure-strategy=ignore
mp.messaging.incoming.incident-events-stream.value.deserializer=org.apache.kafka.common.serialization.StringDeserializer
# Dev and test brokers get the topics up front; several event partitions exercise keying.
# compose-devservices.yml (kafka-init) creates the same topics for runs without dev mode.
quarkus.kafka.devservices.topic-partitions."ops.alerts.v1"=1
quarkus.kafka.devservices.topic-partitions."ops.alerts.v1.dlq"=1
quarkus.kafka.devservices.topic-partitions."ops.incidents.events.v1"=3

# --- local development services (P-0016, A-0008) ------------------------------
# Dev mode runs PostgreSQL and Kafka from compose-devservices.yml in the repository root (the
# path is relative to this module). The services and their volumes outlive the dev mode
# session; the project name matches the file's top-level name, so the next session and the
# docker compose CLI find the same services. Ryuk is off because it would remove the project,
# volumes included, once the dev mode JVM exits.
quarkus.compose.devservices.files=../compose-devservices.yml
quarkus.compose.devservices.project-name=incident-assistant
quarkus.compose.devservices.stop-services=false
quarkus.compose.devservices.remove-volumes=false
quarkus.compose.devservices.ryuk-enabled=false
# Kafka Dev Services would otherwise connect to a shared broker started by another dev mode
# application before looking at the compose services.
%dev.quarkus.kafka.devservices.shared=false

# --- REST API and security (A-0006, P-0009, P-0019) ---------------------------
# Hybrid mode: machine clients send bearer tokens from Keycloak; browsers log in with the code
# flow handled by this service and get an encrypted session cookie (A-0010). Roles come from the
# access token's realm_access.roles in both cases, the approver identity stored with a decision is
# the token subject. The issuer comes from OIDC_AUTH_SERVER_URL in prod; dev mode discovers the
# compose Keycloak (realm incident-assistant). The client secret also derives the keys of the
# state and session cookies; with fewer than 32 characters the state key is generated per
# instance, so a login started on one instance fails on another.
quarkus.oidc.application-type=hybrid
quarkus.oidc.client-id=incident-assistant
%dev.quarkus.oidc.credentials.secret=incident-assistant-local-secret
%prod.quarkus.oidc.credentials.secret=${OIDC_CLIENT_SECRET}
quarkus.oidc.token.principal-claim=sub
quarkus.oidc.roles.source=accesstoken
%prod.quarkus.oidc.auth-server-url=${OIDC_AUTH_SERVER_URL}
quarkus.keycloak.devservices.realm-name=incident-assistant
# Browser login (A-0010): the UI sends the user to /login when /api/v1/me answers 401. The
# identity provider redirects back to /login, where the code is redeemed and the UI is served
# directly. No redirect follows the callback: a redirect chain that started at a cross-site
# identity provider would drop the SameSite=Strict session cookie and start the login again. The
# UI removes code and state from the address and returns to the page the user wanted.
quarkus.http.auth.permission.browser-session.paths=/login,/logout
quarkus.http.auth.permission.browser-session.policy=authenticated
quarkus.oidc.authentication.redirect-path=/login
quarkus.oidc.authentication.restore-path-after-redirect=false
quarkus.oidc.authentication.remove-redirect-parameters=false
quarkus.oidc.authentication.pkce-required=true
quarkus.oidc.authentication.cookie-same-site=strict
quarkus.oidc.authentication.cookie-force-secure=true
# Expired tokens of a session are refreshed with its refresh token while the session cookie lives.
quarkus.oidc.token.refresh-expired=true
# Ends the session of this service and, through the identity provider's end-session endpoint, the
# identity provider session; then the UI starts again.
quarkus.oidc.logout.path=/logout
quarkus.oidc.logout.post-logout-path=/
# Resource paths are relative to /api. REST owns only that prefix: it answers unknown paths below
# it with a 404 Problem Details itself, so every other path reaches the web UI (SPA routing).
quarkus.rest.path=/api
# Authentication runs when a secured endpoint is reached, so 401 and 403 are Problem Details too.
quarkus.http.auth.proactive=false
quarkus.smallrye-openapi.info-title=incident-assistant API
quarkus.smallrye-openapi.info-version=1
quarkus.smallrye-openapi.security-scheme=jwt

# --- web UI (A-0010, P-0019) --------------------------------------------------
# Built from src/main/webui with a pinned Node.js installed by Quinoa (into .quinoa of the module)
# and a frozen lock file; the packaged build also runs the UI tests. Dev mode proxies to the Vite
# dev server with live reload. Every path except /api and /q falls back to index.html (SPA
# routing), so /login and /incidents/<id> load the UI.
quarkus.quinoa.package-manager-install=true
quarkus.quinoa.package-manager-install.node-version=24.22.1
quarkus.quinoa.ci=true
quarkus.quinoa.build-dir=dist
quarkus.quinoa.enable-spa-routing=true
quarkus.quinoa.ignored-path-prefixes=/api,/q
quarkus.quinoa.dev-server.port=5173
%prod.quarkus.quinoa.run-tests=true
# No software bill of materials for the UI: the service build produces none for its Java
# dependencies either, and generating it downloads an extra tool on every build.
quarkus.quinoa.sbom.enabled=false
# Strict Content Security Policy (P-0019): only scripts, styles and connections of this origin, no
# inline code, no framing. Not on /q, whose dev tools need inline scripts. Dev mode allows the
# inline scripts and websocket of the Vite dev server (live reload).
quarkus.http.filter.ui-security.matches=/(?!q/).*
quarkus.http.filter.ui-security.header."Content-Security-Policy"=default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; connect-src 'self'; manifest-src 'self'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'; object-src 'none'
%dev.quarkus.http.filter.ui-security.header."Content-Security-Policy"=default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self'; font-src 'self'; connect-src 'self' ws:; manifest-src 'self'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'; object-src 'none'
quarkus.http.filter.ui-security.header."X-Content-Type-Options"=nosniff
# The login callback leaves the (already redeemed) code in the address until the UI removes it.
quarkus.http.filter.ui-security.header."Referrer-Policy"=no-referrer

# --- knowledge base (A-0004, A-0013, P-0021) ----------------------------------
# Markdown documents with front matter; dev and test read the repository's knowledge/ (relative to
# this module), prod a directory provided with the image or a volume. Dev mode ingests at startup.
incident.knowledge.directory=../knowledge
%prod.incident.knowledge.directory=${INCIDENT_KNOWLEDGE_DIRECTORY}
%dev.incident.knowledge.ingest-on-startup=true
incident.knowledge.max-segment-length=1500
incident.knowledge.retrieval.limit=5
incident.knowledge.retrieval.min-score=0.6
# Embeddings from Ollama in every profile (A-0013); the stored model id names provider and model.
# Dev mode uses the compose Ollama at the default address localhost:11434 and pulls the model on
# first use; prod requires OLLAMA_BASE_URL. Tests use a fake embedding model and no Ollama.
quarkus.langchain4j.ollama.embedding-model.model-id=nomic-embed-text
incident.knowledge.embedding-model=ollama/${quarkus.langchain4j.ollama.embedding-model.model-id}
%prod.quarkus.langchain4j.ollama.base-url=${OLLAMA_BASE_URL}
quarkus.langchain4j.ollama.timeout=30s
%test.quarkus.langchain4j.ollama.devservices.enabled=false
%test.incident.knowledge.embedding-model=test/fake-embedding
quarkus.fault-tolerance."dev.mfa.incident.service.KnowledgeEmbedder/embed".retry.max-retries=2
quarkus.fault-tolerance."dev.mfa.incident.service.KnowledgeEmbedder/embed".retry.delay=1
quarkus.fault-tolerance."dev.mfa.incident.service.KnowledgeEmbedder/embed".retry.delay-unit=seconds

# --- incident event stream (A-0009, P-0018) -----------------------------------
incident.stream.heartbeat-interval=15s
incident.stream.client-buffer-size=256
incident.stream.max-streams=200
incident.stream.retry-after=5s

# --- alert ingestion (A-0003) -------------------------------------------------
incident.alerts.max-payload-bytes=65536
# Retries of one alert after a processing failure (for example a lost database connection),
# each in a new transaction; after the last one the record goes to the DLQ.
quarkus.fault-tolerance."dev.mfa.incident.service.AlertIngestionService/ingest".retry.max-retries=3
quarkus.fault-tolerance."dev.mfa.incident.service.AlertIngestionService/ingest".retry.delay=500
quarkus.fault-tolerance."dev.mfa.incident.service.AlertIngestionService/ingest".retry.delay-unit=millis
quarkus.fault-tolerance."dev.mfa.incident.service.AlertIngestionService/ingest".retry.jitter=200
quarkus.fault-tolerance."dev.mfa.incident.service.AlertIngestionService/ingest".retry.jitter-unit=millis
quarkus.fault-tolerance."dev.mfa.incident.service.AlertIngestionService/ingest".retry.max-duration=30
quarkus.fault-tolerance."dev.mfa.incident.service.AlertIngestionService/ingest".retry.max-duration-unit=seconds

# --- outbox relay (P-0003) ----------------------------------------------------
incident.outbox.relay.interval=1s
incident.outbox.relay.batch-size=100
incident.outbox.relay.send-timeout=10s
incident.outbox.relay.max-batch-duration=10s

# --- dev ---------------------------------------------------------------------
%dev.quarkus.http.port=8080
%dev.quarkus.log.category."dev.mfa.incident".level=DEBUG

# --- test --------------------------------------------------------------------
%test.quarkus.http.test-port=0
# Tests get empty, per-run Dev Services containers, never the compose services (P-0010).
%test.quarkus.compose.devservices.enabled=false
# Tests authenticate with @TestSecurity; one test profile starts a real Keycloak
# (KeycloakRealmTest).
%test.quarkus.keycloak.devservices.enabled=false
%test.quarkus.oidc.tenant-enabled=false
%test.incident.instance.id=test-instance

# --- prod --------------------------------------------------------------------
# No local fallback: every production instance must have an explicit, unique id.
%prod.incident.instance.id=${INCIDENT_INSTANCE_ID:${HOSTNAME}}
