# Local development services (P-0016, A-0008). Quarkus dev mode starts and discovers them
# through Compose Dev Services and leaves them running when it stops; tests do not use this
# file. Credentials are for local use only. Clean start: docker compose -f
# compose-devservices.yml down -v
name: incident-assistant

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: incident
      POSTGRES_PASSWORD: incident
      POSTGRES_DB: incident
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U incident -d incident"]
      interval: 2s
      timeout: 5s
      retries: 30

  # Single node in KRaft combined mode. Host clients use localhost:9092, containers on the
  # compose network use kafka:19092.
  kafka:
    image: apache/kafka:4.2.0
    environment:
      CLUSTER_ID: vrHUsQesT6Wq6MJkHqP22A
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,INTERNAL://:19092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,INTERNAL://kafka:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    ports:
      - "9092:9092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:19092 > /dev/null"]
      interval: 5s
      timeout: 20s
      retries: 20
      start_period: 10s

  # Creates the topics once the broker is healthy, with the partition counts of
  # quarkus.kafka.devservices.topic-partitions, then exits. Quarkus neither waits for it nor
  # takes it for the broker (same image, so it would match while running).
  kafka-init:
    image: apache/kafka:4.2.0
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-ec"]
    command:
      - |
        for topic in ops.alerts.v1:1 ops.alerts.v1.dlq:1 ops.incidents.events.v1:3; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --create --if-not-exists \
            --topic "$${topic%%:*}" --partitions "$${topic##*:}"
        done
    restart: "no"
    labels:
      io.quarkus.devservices.compose.wait_for.ports.disable: true
      io.quarkus.devservices.compose.ignore: true

  # Creates the schemas that are not managed by an application's Flyway (A-0008), then exits.
  # Runs on every start, so it also works on volumes created before a schema existed.
  postgres-init:
    image: pgvector/pgvector:pg17
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: incident
    entrypoint: ["psql", "-h", "postgres", "-U", "incident", "-d", "incident", "-v", "ON_ERROR_STOP=1"]
    command: ["-c", "create schema if not exists keycloak"]
    restart: "no"
    labels:
      io.quarkus.devservices.compose.wait_for.ports.disable: true
      io.quarkus.devservices.compose.ignore: true

  # Local identity provider (A-0008, A-0006). Data in schema keycloak of postgres, so it lives on
  # the kept pgdata volume. The realm is imported on first start only; later changes made in the
  # admin console (http://localhost:8180, admin/admin) are kept.
  keycloak:
    image: quay.io/keycloak/keycloak:26.7.4
    depends_on:
      postgres-init:
        condition: service_completed_successfully
    command: ["start-dev", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/incident
      KC_DB_SCHEMA: keycloak
      KC_DB_USERNAME: incident
      KC_DB_PASSWORD: incident
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: "true"
    ports:
      - "8180:8080"
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q '"status": "UP"' <&3
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  # Local SMTP server for notification-service (A-0011): SMTP on 1025, web UI on
  # http://localhost:8025. Mails are kept in memory only and lost when the container stops.
  mailpit:
    image: axllent/mailpit:v1.31.6
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  pgdata:
    name: incident-assistant-pgdata
  kafka-data:
    name: incident-assistant-kafka
