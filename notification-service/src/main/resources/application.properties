quarkus.application.name=notification-service

# --- database (A-0011) --------------------------------------------------------
# Schema notification of the incident database; connection settings come from
# QUARKUS_DATASOURCE_JDBC_URL, QUARKUS_DATASOURCE_USERNAME and QUARKUS_DATASOURCE_PASSWORD in prod
# (role notification_service, rights on this schema only); dev uses compose-devservices.yml, test
# uses Dev Services.
quarkus.datasource.db-kind=postgresql
quarkus.datasource.devservices.image-name=pgvector/pgvector:pg17
# The search path holds only the own schema, so even native SQL cannot reach another one by
# accident. Timeouts as in incident-assistant-app: pooled connection, opening one, a single
# statement, a blocked socket read, a whole transaction.
quarkus.datasource.jdbc.additional-jdbc-properties.currentSchema=notification
quarkus.datasource.jdbc.acquisition-timeout=5S
quarkus.datasource.jdbc.additional-jdbc-properties.connectTimeout=5
quarkus.datasource.jdbc.additional-jdbc-properties.options=-c statement_timeout=10s
quarkus.datasource.jdbc.additional-jdbc-properties.socketTimeout=30
quarkus.transaction-manager.default-transaction-timeout=30S
# Flyway creates the schema and keeps its history table there; Hibernate only validates.
quarkus.flyway.migrate-at-start=true
quarkus.flyway.schemas=notification
quarkus.hibernate-orm.database.default-schema=notification
quarkus.hibernate-orm.schema-management.strategy=validate

# --- Kafka (A-0011, A-0007) ---------------------------------------------------
# State events in, with a consumer group of this service. A new group starts at the latest
# offset, so a first deployment does not notify about past events. A record is committed after
# its event is recorded; when recording still fails after its retries, the channel stops and
# readiness reports it (no event is skipped silently).
mp.messaging.incoming.incident-events.topic=ops.incidents.events.v1
mp.messaging.incoming.incident-events.group.id=notification-service
mp.messaging.incoming.incident-events.auto.offset.reset=latest
mp.messaging.incoming.incident-events.value.deserializer=org.apache.kafka.common.serialization.StringDeserializer
quarkus.kafka.devservices.topic-partitions."ops.incidents.events.v1"=3
quarkus.fault-tolerance."dev.mfa.incident.notification.service.EventIngestionService/ingest".retry.max-retries=3
quarkus.fault-tolerance."dev.mfa.incident.notification.service.EventIngestionService/ingest".retry.delay=500
quarkus.fault-tolerance."dev.mfa.incident.notification.service.EventIngestionService/ingest".retry.delay-unit=millis
quarkus.fault-tolerance."dev.mfa.incident.notification.service.EventIngestionService/ingest".retry.jitter=200
quarkus.fault-tolerance."dev.mfa.incident.notification.service.EventIngestionService/ingest".retry.jitter-unit=millis

# --- incident API and its token (A-0011, A-0006) ------------------------------
# GET /api/v1/incidents/{id} of incident-assistant-app with a client credentials token of the
# Keycloak client notification-service (service account with role incident-viewer).
%dev.quarkus.rest-client.incident-api.url=http://localhost:8080
%prod.quarkus.rest-client.incident-api.url=${INCIDENT_API_URL}
quarkus.rest-client.incident-api.connect-timeout=2000
quarkus.rest-client.incident-api.read-timeout=5000
quarkus.oidc-client.client-id=notification-service
quarkus.oidc-client.connection-timeout=5S
%dev.quarkus.oidc-client.auth-server-url=http://localhost:8180/realms/incident-assistant
%dev.quarkus.oidc-client.credentials.secret=notification-service-local-secret
%prod.quarkus.oidc-client.auth-server-url=${OIDC_AUTH_SERVER_URL}
%prod.quarkus.oidc-client.credentials.secret=${OIDC_CLIENT_SECRET}
# Dev mode uses the compose Keycloak at the address above; tests replace the API client.
quarkus.keycloak.devservices.enabled=false
# Retries per lookup, then a circuit breaker over all lookups; after both the minimal message is
# sent.
quarkus.fault-tolerance."dev.mfa.incident.notification.service.IncidentDetailsService/lookup".retry.max-retries=2
quarkus.fault-tolerance."dev.mfa.incident.notification.service.IncidentDetailsService/lookup".retry.delay=500
quarkus.fault-tolerance."dev.mfa.incident.notification.service.IncidentDetailsService/lookup".retry.delay-unit=millis
quarkus.fault-tolerance."dev.mfa.incident.notification.service.IncidentDetailsService/lookup".circuit-breaker.request-volume-threshold=10
quarkus.fault-tolerance."dev.mfa.incident.notification.service.IncidentDetailsService/lookup".circuit-breaker.failure-ratio=0.8
quarkus.fault-tolerance."dev.mfa.incident.notification.service.IncidentDetailsService/lookup".circuit-breaker.delay=30
quarkus.fault-tolerance."dev.mfa.incident.notification.service.IncidentDetailsService/lookup".circuit-breaker.delay-unit=seconds

# --- e-mail (A-0011) ----------------------------------------------------------
# SMTP from SMTP_* environment variables in prod; dev sends to Mailpit (compose-devservices.yml,
# web UI http://localhost:8025); tests use the mock mailbox.
quarkus.mailer.from=${NOTIFICATION_MAIL_FROM:incident-assistant@localhost}
quarkus.mailer.timeout=30S
%dev.quarkus.mailer.mock=false
%dev.quarkus.mailer.host=localhost
%dev.quarkus.mailer.port=1025
%prod.quarkus.mailer.host=${SMTP_HOST}
%prod.quarkus.mailer.port=${SMTP_PORT:587}
%prod.quarkus.mailer.username=${SMTP_USERNAME:}
%prod.quarkus.mailer.password=${SMTP_PASSWORD:}
%prod.quarkus.mailer.start-tls=REQUIRED

# --- notifications (A-0011) ---------------------------------------------------
%dev.notification.ui-base-url=http://localhost:8080
%test.notification.ui-base-url=https://incidents.example.test
%prod.notification.ui-base-url=${NOTIFICATION_UI_BASE_URL}
notification.rules.approval-needed.state=AWAITING_APPROVAL
notification.rules.approval-needed.recipients=approvers
notification.rules.approval-needed.subject=[incident-assistant] Approval needed: {service} ({severity})
notification.rules.escalated.state=ESCALATED
notification.rules.escalated.recipients=on-call
notification.rules.escalated.subject=[incident-assistant] Escalated: {service} ({severity}) – {reasonCode}
# Comma-separated addresses.
%dev.notification.recipients.approvers=approvers@incident-assistant.local
%dev.notification.recipients.on-call=on-call@incident-assistant.local
%test.notification.recipients.approvers=approver-1@example.test,approver-2@example.test
%test.notification.recipients.on-call=on-call@example.test
%prod.notification.recipients.approvers=${NOTIFICATION_RECIPIENTS_APPROVERS}
%prod.notification.recipients.on-call=${NOTIFICATION_RECIPIENTS_ON_CALL}
notification.sender.interval=5s
notification.sender.batch-size=20
notification.sender.max-attempts=5
notification.sender.backoff-base=30s
notification.sender.claim-timeout=5m

# --- local development services (P-0016, A-0008) ------------------------------
# The same compose services as incident-assistant-app; whichever dev mode starts first starts
# them, the other one finds them running.
quarkus.compose.devservices.files=../compose-devservices.yml
quarkus.compose.devservices.project-name=incident-assistant
quarkus.compose.devservices.stop-services=false
quarkus.compose.devservices.remove-volumes=false
quarkus.compose.devservices.ryuk-enabled=false
%dev.quarkus.kafka.devservices.shared=false

# --- dev ---------------------------------------------------------------------
%dev.quarkus.http.port=8082
%dev.quarkus.log.category."dev.mfa.incident".level=DEBUG

# --- test --------------------------------------------------------------------
%test.quarkus.http.test-port=0
%test.quarkus.compose.devservices.enabled=false
# Tests connect as the restricted role of production: the init script creates role
# notification_service owning schema notification and a table in schema public it may not read,
# and every connection switches to that role. Any statement outside the own schema fails.
%test.quarkus.datasource.devservices.init-script-path=db/test-roles.sql
%test.quarkus.datasource.jdbc.new-connection-sql=set role notification_service
# Tests replace the API client; the token client is never called.
%test.quarkus.rest-client.incident-api.url=http://localhost:1
%test.quarkus.oidc-client.auth-server-url=http://localhost:1/realms/incident-assistant
%test.quarkus.oidc-client.credentials.secret=test-only-secret
%test.quarkus.oidc-client.discovery-enabled=false
%test.quarkus.oidc-client.token-path=/protocol/openid-connect/token
%test.notification.sender.interval=200ms
%test.notification.sender.backoff-base=200ms
%test.notification.sender.max-attempts=3
